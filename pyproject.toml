[project]
name = "deskmind-eyes"
version = "0.1.0"
description = "Screenshot to point: a small GUI grounding model and its SFT / RL recipe"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "The DeskMind authors"}]
readme = "README.md"
keywords = ["gui-grounding", "computer-use", "screenspot", "reinforcement-learning", "vision-language-model"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core: data preparation (prepare_*), the MLX quick start and ground_server (with the mlx extra), compare.
dependencies = [
    "pillow",
    "huggingface-hub",
]

[project.urls]
Homepage = "https://github.com/deskmind-ai/eyes"
Repository = "https://github.com/deskmind-ai/eyes"
Issues = "https://github.com/deskmind-ai/eyes/issues"

[project.optional-dependencies]
test = ["pytest>=8"]
# Local Apple Silicon eval (deskmind_eyes/eval_mlx.py). Alternatively: `uv tool install mlx-vlm`.
mlx = ["mlx-vlm>=0.7.1"]
# Tinker SFT / RL / eval (train.py, rl.py, eval_tinker.py, evaluator.py, difficulty.py, export_ckpt.py).
tinker = ["tinker==0.29.0", "tinker-cookbook==0.5.7"]
# Hugging Face / PyTorch training and merging (train_hf.py, rl_hf.py, merge_hf_lora.py, dedup_uivision.py,
# leaderboard/models). vLLM for eval_vllm / difficulty_vllm is installed separately (see README).
hf = ["torch", "transformers", "peft", "safetensors", "numpy"]

[tool.setuptools]
packages = ["deskmind_eyes"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.uv]
# mlx-vlm and the Tinker cookbook pin incompatible transformers ranges: installed one at a time
# (`uv sync --extra mlx` or `--extra tinker`), and a plain `uv run` from a clean clone resolves.
conflicts = [[{ extra = "mlx" }, { extra = "tinker" }]]
